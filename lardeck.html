<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Dari PHP ke Laravel: Refactor Backend CRUD</title>
		<meta
			name="description"
			content="Materi Laravel Backend: Routing, Eloquent, Blade, dan CRUD untuk peserta peminatan Backend, lanjutan dari materi PHP"
		/>

		<link rel="stylesheet" href="dist/reset.css" />
		<link rel="stylesheet" href="dist/reveal.css" />
		<link rel="stylesheet" href="dist/theme/black.css" id="theme" />

		<!-- Theme untuk syntax highlighting -->
		<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />

		<!-- Style khusus deck ini. HARUS terakhir supaya override menang. -->
		<link rel="stylesheet" href="lardeck/css/lardeck.css" />
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<!--
					Satu <section data-markdown> per Part. Tiap file .md berisi
					beberapa slide yang dipisahkan separator kosong.

					Separator di file .md (sama seperti deck PHP):
					  3 baris kosong = slide horizontal berikutnya (CORE)
					  2 baris kosong = slide vertical  (umumnya SELF-STUDY)
					  "Note:"        = speaker notes (maksimal SATU per slide)

					Kurikulum mengikuti https://roadmap.sh/laravel
					Proyek referensi: lardeck/project/lara-student
				-->
				<section
					data-markdown="lardeck/slides/00-opening.md"
					data-separator="^\r?\n\r?\n\r?\n\r?\n"
					data-separator-vertical="^\r?\n\r?\n\r?\n"
					data-separator-notes="^Note:"
					data-charset="utf-8"
				></section>

				<section
					data-markdown="lardeck/slides/01-getting-started.md"
					data-separator="^\r?\n\r?\n\r?\n\r?\n"
					data-separator-vertical="^\r?\n\r?\n\r?\n"
					data-separator-notes="^Note:"
					data-charset="utf-8"
				></section>

				<section
					data-markdown="lardeck/slides/02-routing.md"
					data-separator="^\r?\n\r?\n\r?\n\r?\n"
					data-separator-vertical="^\r?\n\r?\n\r?\n"
					data-separator-notes="^Note:"
					data-charset="utf-8"
				></section>

				<section
					data-markdown="lardeck/slides/03-database.md"
					data-separator="^\r?\n\r?\n\r?\n\r?\n"
					data-separator-vertical="^\r?\n\r?\n\r?\n"
					data-separator-notes="^Note:"
					data-charset="utf-8"
				></section>

				<section
					data-markdown="lardeck/slides/04-blade.md"
					data-separator="^\r?\n\r?\n\r?\n\r?\n"
					data-separator-vertical="^\r?\n\r?\n\r?\n"
					data-separator-notes="^Note:"
					data-charset="utf-8"
				></section>

				<section
					data-markdown="lardeck/slides/05-forms-crud.md"
					data-separator="^\r?\n\r?\n\r?\n\r?\n"
					data-separator-vertical="^\r?\n\r?\n\r?\n"
					data-separator-notes="^Note:"
					data-charset="utf-8"
				></section>

				<section
					data-markdown="lardeck/slides/06-relasi-peta.md"
					data-separator="^\r?\n\r?\n\r?\n\r?\n"
					data-separator-vertical="^\r?\n\r?\n\r?\n"
					data-separator-notes="^Note:"
					data-charset="utf-8"
				></section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="dist/plugin/markdown.js"></script>
		<script src="dist/plugin/highlight.js"></script>
		<script src="dist/plugin/notes.js"></script>
		<script>
			Reveal.initialize({
				hash: true,
				slideNumber: 'c/t',
				// Beri ruang lebih untuk code block yang panjang
				width: 1280,
				height: 800,
				margin: 0.06,
				plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
			});
		</script>
	</body>
</html>
